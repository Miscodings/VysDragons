# VysDragons - egg -> baby -> young -> adult.
#
# All timers run on the real wall clock: they keep counting while the owner is
# offline, the chunk is unloaded, or the server is down. Eggs are the exception -
# they only count while heated (see egg.heat below).

time:
  # Real minutes in one Minecraft day (vanilla is 20).
  real-minutes-per-minecraft-day: 20
  # Heated time an egg needs before it hatches.
  egg-hatch-days: 3
  # How long a dragon stays a baby before growing to young.
  baby-days: 30
  # How long a dragon stays young before growing to adult.
  young-days: 60

egg:
  # Nexo item id for the egg item (given by /vysdragons give, dropped when a placed
  # egg is hit).
  nexo-item: dragon_egg_fire
  # MythicMobs mob spawned when the egg is placed. The mob attaches its own model.
  mob-type: dragon_egg_fire
  # Every skin has its own egg: the Nexo item and the MythicMobs mob are named from these
  # patterns (%skin% is a name from dragon.skins), and hatch into that skin. The untyped
  # nexo-item / mob-type above stay for old eggs, which roll a random skin.
  nexo-item-pattern: "dragon_egg_%skin%"
  mob-type-pattern: "dragon_egg_%skin%"
  heat:
    # Blocks that count as heat. Lit campfires only.
    blocks:
      - FIRE
      - SOUL_FIRE
      - LAVA
      - MAGMA_BLOCK
      - CAMPFIRE
      - SOUL_CAMPFIRE
    # How many heat blocks must be within scan-radius of the egg for it to warm up.
    required-count: 8
    # Radius (blocks) of the cube scanned around the egg.
    scan-radius: 2
  # How often (ticks) a loaded egg re-checks its heat.
  check-interval-ticks: 20
  # Animations in the egg models. `warm` loops while the egg is heated; `hatch` plays when
  # it hatches: the baby appears hatch-spawn-after-ticks into it and the shell is removed
  # at hatch-remove-after-ticks (20 ticks = 1 second).
  animations:
    warm: warm
    hatch: hatch
    hatch-spawn-after-ticks: 60
    hatch-remove-after-ticks: 100
  # Floating status text above a placed egg (the text itself is in lang.yml).
  display:
    enabled: true
    height: 1.1

dragon:
  # MythicMobs mob type for each stage. The plugin attaches the ModelEngine model
  # itself, and sets these MythicMobs variables on the mob:
  #   caster.model    - the current model id (read by the mount/flight controller)
  #   caster.saddled  - "true"/"false"
  #   caster.element  - breath-element below (selects which breath skill fires)
  #   caster.state    - "ground"
  # Babies and adults share one mob type, young dragons have their own (a little slower).
  # Growing between stages that share a type swaps the model on the same mob; a different
  # type respawns it. (A baby can't use the mount/flight skills: it can never be saddled.)
  mob-types:
    baby: cksmp_dragon_adult
    young: cksmp_dragon_young
    adult: cksmp_dragon_adult
  # Optional MythicMobs skill cast on the mob right after its model is attached
  # (e.g. extra setup). Leave empty for none. Must NOT attach a model itself.
  setup-skills:
    baby: ""
    young: ""
    adult: ""
  # Skill cast when a young/adult is left in a flight state with nobody riding it
  # (rider logged out mid-flight). Should restore ground animations. The plugin then
  # resets caster.state to "ground" itself. Empty for none.
  orphan-reset-skill: Dragon_OrphanReset
  # Value written to caster.element. The existing breath skills fire on "fire".
  breath-element: fire

  # Skin pool - every hatch rolls one at random. Kept for the dragon's whole life.
  skins:
    - scarlet_black
    - brown
    - black_and_red
    - autumn_orange
    - albino_floss
    - prisma_blue
    - pale_white
    - ice_blue
    - celestial_blue
    - pale_gray
    - moss_green
    - forest_green
    - emerald_green
    - bronze_jade
    - pale_faced
    - undead_blue
    - red_and_black
    - end_purple
    - royal_red
    - dream_blue
    - cream_gold_white_forehead
    - cream_gold
    - albino
  # ModelEngine model ids. %skin% and %stage% (baby/young/adult) are substituted.
  model: "robust_dragon_%skin%_%stage%"
  saddled-model: "robust_dragon_%skin%_%stage%_saddled"

  # Max health per stage.
  max-health:
    baby: 20.0
    young: 60.0
    adult: 100.0
  # Attack damage per stage. The breath skills read it via <caster.damage>.
  attack-damage:
    baby: 0.0
    young: 6.0
    adult: 10.0

  # Saddling (young/adult only): right-click with saddle-item. Unsaddle with
  # sneak + right-click holding unsaddle-item (the saddle is returned).
  saddle-item: SADDLE
  unsaddle-item: SHEARS

  # Adult passenger seat (ModelEngine bone id). While the owner is riding, any other
  # player who right-clicks the adult takes this seat.
  passenger-seat: seat2

  follow:
    # Beyond this distance (blocks) a following dragon teleports to its owner.
    teleport-distance:
      baby: 15.0
      young: 15.0
      adult: 10.0
    # Stops walking once this close to the owner.
    stop-distance: 3.0
    speed: 1.0

  animations:
    lerp-in: 0.2
    lerp-out: 0.2
    speed: 1.0
    # Loops while sitting (all stages).
    sit: sit
    # Baby only: plays once at a random interval.
    baby-quirk: quirk
    baby-quirk-min-seconds: 30
    baby-quirk-max-seconds: 90

# All messages, menu looks, the egg hologram text, nameplates and stage names are in
# lang.yml.
