# VysDragons text and menu looks. Everything uses MiniMessage formatting
# (https://docs.advntr.dev/minimessage/format.html). Apply changes with /vysdragons reload.
#
# Palette used below, so new lines can match:
#   body text   #C9C3D9   soft lavender gray
#   muted       #8A8499
#   highlight   #FFC46B   warm amber
#   fire        #FF7A18 -> #FFB347 (prefix / titles gradient)
#   success     #7CE3A1   mint
#   info        #7FD1FF   sky
#   error       #FF6B6B   coral

# Put in front of every chat message. Empty for none.
prefix: "<bold><gradient:#FF7A18:#FFB347>Dragons</gradient></bold> <#5C5470>»</#5C5470> "

# Name shown for each stage in %stage%.
stage-names:
  baby: Baby
  young: Young
  adult: Adult

# Nameplate above every dragon. %owner%, %stage%. Empty to hide it.
nameplate: "<#FFC46B>%owner%'s Dragon</#FFC46B> <#8A8499>· %stage%</#8A8499>"

# Floating text above a placed egg. %percent%, %time% (heated time left), %count%
# (heat blocks needed).
egg-display:
  warming: "<gradient:#FF7A18:#FFB347><bold>Warming</bold></gradient> <#FFC46B>%percent%%</#FFC46B> <#8A8499>· %time% left</#8A8499>"
  idle: "<#8A8499>Idle <#C9C3D9>%percent%%</#C9C3D9> · needs <#FFC46B>%count%</#FFC46B> heat blocks nearby</#8A8499>"

# /dragons menu. One icon per dragon; the menu grows to fit (up to 6 rows).
# Placeholders in name and lore: %skin%, %stage%, %growth%, %saddled%
menu:
  title: "<bold><gradient:#FF7A18:#FFB347>Your Dragons</gradient></bold>"
  # Any item name from https://jd.papermc.io/paper/1.21.11/org/bukkit/Material.html
  item-out: DRAGON_HEAD
  item-stored: DRAGON_EGG
  name: "<bold><#FFC46B>%skin% Dragon</#FFC46B></bold> <#8A8499>%stage%</#8A8499>"
  lore-out:
    - "<#7CE3A1>● Out with you</#7CE3A1>"
    - ""
    - "<#8A8499>Growth</#8A8499> <#C9C3D9>%growth%</#C9C3D9>"
    - "<#8A8499>Saddle</#8A8499> <#C9C3D9>%saddled%</#C9C3D9>"
    - ""
    - "<#FFC46B>▸ Click</#FFC46B> <#C9C3D9>to put away</#C9C3D9>"
  lore-stored:
    - "<#7FD1FF>● Resting</#7FD1FF>"
    - ""
    - "<#8A8499>Growth</#8A8499> <#C9C3D9>%growth%</#C9C3D9>"
    - "<#8A8499>Saddle</#8A8499> <#C9C3D9>%saddled%</#C9C3D9>"
    - ""
    - "<#FFC46B>▸ Click</#FFC46B> <#C9C3D9>to summon</#C9C3D9>"
  # %growth% is one of these two. %time% is the time until the next stage.
  grows-in: "grows up in <#FFC46B>%time%</#FFC46B>"
  fully-grown: "<#7CE3A1>fully grown</#7CE3A1>"
  # %saddled% is one of these two.
  saddled-yes: "<#7CE3A1>on</#7CE3A1>"
  saddled-no: "<#8A8499>none</#8A8499>"
  # Shown alone when the player has no dragons.
  empty-item: BARRIER
  empty-name: "<#FF6B6B>You don't have any dragons yet</#FF6B6B>"

messages:
  # Eggs
  egg-placed: "<#C9C3D9>Egg placed! Surround it with <#FFC46B>%count%</#FFC46B> heat blocks <#8A8499>(fire, lava, magma, campfires)</#8A8499> to incubate it.</#C9C3D9>"
  egg-place-failed: "<#FF6B6B>That egg couldn't be placed. Tell an admin.</#FF6B6B>"
  egg-picked-up: "<#C9C3D9>You picked the egg back up. <#8A8499>Its warmth is kept.</#8A8499></#C9C3D9>"
  egg-hatched: "<bold><gradient:#FF7A18:#FFB347>Your egg hatched!</gradient></bold> <#C9C3D9>Your baby dragon will follow you around.</#C9C3D9>"

  # Growing up and dying
  grew-young: "<bold><gradient:#FF7A18:#FFB347>Your dragon grew up!</gradient></bold> <#C9C3D9>It's young now. Saddle it to ride.</#C9C3D9>"
  grew-adult: "<bold><gradient:#FF7A18:#FFB347>Your dragon is fully grown!</gradient></bold>"
  died: "<#FF6B6B>Your dragon has died.</#FF6B6B>"

  # Interacting
  sitting: "<#C9C3D9>Your dragon <#FFC46B>sits</#FFC46B>.</#C9C3D9>"
  following: "<#C9C3D9>Your dragon <#FFC46B>follows you</#FFC46B>.</#C9C3D9>"
  saddled: "<#7CE3A1>Saddled!</#7CE3A1> <#C9C3D9>Right-click to ride.</#C9C3D9>"
  unsaddled: "<#C9C3D9>Saddle removed.</#C9C3D9>"
  too-young-to-saddle: "<#FF6B6B>Your dragon is too young for a saddle.</#FF6B6B>"
  needs-saddle: "<#FFC46B>Your dragon needs a saddle before you can ride it.</#FFC46B>"
  not-your-dragon: "<#FF6B6B>That isn't your dragon.</#FF6B6B>"
  cant-ride-sitting: "<#FF6B6B>Your dragon is sitting.</#FF6B6B> <#C9C3D9>Sneak + right-click to make it stand first.</#C9C3D9>"
  seat-taken: "<#FF6B6B>The passenger seat is taken.</#FF6B6B>"

  # /dragons
  summoned: "<#7CE3A1>Your dragon appears!</#7CE3A1>"
  stored: "<#C9C3D9>Your dragon is <#7FD1FF>resting</#7FD1FF> now.</#C9C3D9>"
  cant-while-ridden: "<#FF6B6B>Get off your dragon first.</#FF6B6B>"
  summon-failed: "<#FF6B6B>Your dragon couldn't be summoned here. Tell an admin.</#FF6B6B>"

  # /vysdragons (admin)
  usage: "<#C9C3D9>/%label% <#FFC46B>give</#FFC46B> <#8A8499><player> [type] [amount]</#8A8499> · <#FFC46B>reload</#FFC46B> · <#FFC46B>info</#FFC46B> · <#FFC46B>grow</#FFC46B></#C9C3D9>"
  player-not-found: "<#FF6B6B>Player not found.</#FF6B6B>"
  players-only: "<#FF6B6B>Only players can use that.</#FF6B6B>"
  no-target: "<#FF6B6B>Look at a dragon or egg, or stand next to one.</#FF6B6B>"
  give-success: "<#7CE3A1>Gave <#FFC46B>%amount%</#FFC46B> dragon egg(s) to <#FFC46B>%player%</#FFC46B>.</#7CE3A1>"
  # %type%
  unknown-type: "<#FF6B6B>Unknown egg type <#FFC46B>%type%</#FFC46B>. Use tab-complete, or <#FFC46B>random</#FFC46B>.</#FF6B6B>"
  give-failed: "<#FF6B6B>Nexo item <#FFC46B>%item%</#FFC46B> doesn't exist.</#FF6B6B>"
  reloaded: "<#7CE3A1>Config and lang reloaded.</#7CE3A1>"
  # %uuid%, %owner%, %skin%, %stage%, %next%, %saddled%, %stored%
  info-dragon: "<#C9C3D9><#FFC46B>%owner%</#FFC46B>'s <#FFC46B>%skin%</#FFC46B> · %stage% · next stage in <#FFC46B>%next%</#FFC46B> · saddled <#FFC46B>%saddled%</#FFC46B> <#8A8499>(%uuid%)</#8A8499></#C9C3D9>"
  info-fully-grown: "fully grown"
  # %skin%, %heated% (true/false), %time% (heated time still needed)
  info-egg: "<#C9C3D9>Egg · <#FFC46B>%skin%</#FFC46B> · heated <#FFC46B>%heated%</#FFC46B> · hatches after <#FFC46B>%time%</#FFC46B> more heat</#C9C3D9>"
  grow-dragon: "<#7CE3A1>It will grow on the next tick.</#7CE3A1>"
  grow-already-adult: "<#FF6B6B>That dragon is already an adult.</#FF6B6B>"
  grow-egg: "<#7CE3A1>Hatched.</#7CE3A1>"
