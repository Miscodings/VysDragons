name: VysDragons
version: '${version}'
main: com.vys.vysdragons.VysDragons
api-version: '1.21'
load: POSTWORLD
depend:
  - MythicMobs
  - ModelEngine
  - Nexo
commands:
  dragons:
    description: Summon or put away your dragons
    usage: /dragons
    permission: vysdragons.use
  vysdragons:
    description: VysDragons admin commands
    usage: /vysdragons <give|reload|info|grow>
    aliases: [vd]
    permission: vysdragons.admin
permissions:
  vysdragons.use:
    description: Open /dragons to summon and put away your dragons
    default: true
  vysdragons.admin:
    description: Use /vysdragons admin commands
    default: op
